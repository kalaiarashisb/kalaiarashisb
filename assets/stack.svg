<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc">
<title id="title">Technology Constellation &amp; Stack Chips — Kalaiarashi S B</title>
<desc id="desc">Three elliptical technology orbits with labeled tech icons and grouped skill chips.</desc>
<defs>
  <linearGradient id="orb-core" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#c6a6f4"/>
    <stop offset="50%" stop-color="#d52cb8"/>
    <stop offset="100%" stop-color="#7928ca"/>
  </linearGradient>
  <linearGradient id="chip-bg-stack" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#1f1437"/>
    <stop offset="100%" stop-color="#150d27"/>
  </linearGradient>
  <linearGradient id="node-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#2a1748"/>
    <stop offset="100%" stop-color="#170c2c"/>
  </linearGradient>
  <filter id="stack-glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <pattern id="dotGridStack" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#7948a8" opacity="0.14"/>
  </pattern>
</defs>

<!-- Outer Container -->
<rect x="1" y="1" width="1098" height="598" rx="26" fill="#08071a" stroke="#5d397a" stroke-width="2"/>
<rect x="1" y="1" width="1098" height="598" rx="26" fill="url(#dotGridStack)"/>

<!-- Section Title -->
<text x="44" y="46" fill="#efa1df" font-family="Arial, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="4">TECHNOLOGY CONSTELLATION</text>

<!-- LEFT: ORBITAL CONSTELLATION -->
<g transform="translate(285, 310)">
  <!-- Elliptical Orbits -->
  <ellipse rx="225" ry="92" transform="rotate(-24)" fill="none" stroke="#c6a6f4" stroke-width="1.8" opacity="0.7"/>
  <ellipse rx="225" ry="92" transform="rotate(28)" fill="none" stroke="#d52cb8" stroke-width="1.8" opacity="0.65"/>
  <ellipse rx="225" ry="92" transform="rotate(86)" fill="none" stroke="#9052b8" stroke-width="1.6" opacity="0.55"/>

  <!-- Glowing Orbit Particles -->
  <circle cx="-195" cy="-35" r="4" fill="#efa1df">
    <animate attributeName="r" values="3.5;7;3.5" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="190" cy="30" r="4" fill="#c6a6f4">
    <animate attributeName="r" values="4;8;4" dur="2.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="15" cy="-190" r="3.5" fill="#ffd43b">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Central Star Core -->
  <circle r="78" fill="#180e2f" stroke="url(#orb-core)" stroke-width="3" filter="url(#stack-glow)"/>
  <g font-family="Arial, -apple-system, sans-serif" text-anchor="middle">
    <text y="-8" fill="#f8f4ff" font-size="20" font-weight="800" letter-spacing="1">CORE TECH</text>
    <text y="18" fill="#efa1df" font-size="11.5" font-weight="700" letter-spacing="2">STACK &amp; TOOLS</text>
  </g>

  <!-- PLANETARY NODE 1: Python -->
  <g transform="translate(-175, -95)">
    <circle r="30" fill="url(#node-bg)" stroke="#387eb8" stroke-width="2"/>
    <!-- Python Icon (Two-tone) -->
    <g transform="translate(-12, -18) scale(0.68)">
      <path fill="#387eb8" d="M17.8 0c-8.9 0-8.3 3.9-8.3 3.9l.01 4h8.4v1.2H6.2S0 8.4 0 17.3c0 9 5.3 8.7 5.3 8.7h3.2v-4.4s-.2-5.3 5.2-5.3h8.3s5-.1 5-4.9V3.8S27.8 0 17.8 0zm-4.7 2.7c.9 0 1.6.7 1.6 1.6s-.7 1.6-1.6 1.6-1.6-.7-1.6-1.6.7-1.6 1.6-1.6z"/>
      <path fill="#ffc331" d="M17.4 34.6c8.9 0 8.3-3.9 8.3-3.9l-.01-4h-8.4v-1.2h11.7s6.2.7 6.2-8.2c0-9-5.3-8.7-5.3-8.7h-3.2v4.4s.2 5.3-5.2 5.3h-8.3s-5 .1-5 4.9v7.6s-.8 3.8 9.2 3.8zm4.7-2.7c-.9 0-1.6-.7-1.6-1.6s.7-1.6 1.6-1.6 1.6.7 1.6 1.6-.7 1.6-1.6 1.6z"/>
    </g>
    <!-- Label -->
    <text y="42" text-anchor="middle" fill="#f8f4ff" font-family="Arial, sans-serif" font-size="11.5" font-weight="700">Python</text>
  </g>

  <!-- PLANETARY NODE 2: Java -->
  <g transform="translate(175, -100)">
    <circle r="30" fill="url(#node-bg)" stroke="#e76f00" stroke-width="2"/>
    <!-- Java Coffee Cup Icon -->
    <g transform="translate(-11, -12) scale(0.9)">
      <path fill="#5382a1" d="M3.7 14.8c4.5.3 9.4-.5 12.7-2.8-.8 2.2-4.2 3.8-9.4 4.1-3.6.2-4.5-.4-3.3-1.3z"/>
      <path fill="#e76f00" d="M12.6 1c.5 1.5-1 3-1.8 4.2-.7 1.1-1.3 2.1-1.3 3.3 0 1.2.9 2.2 2 2.7-.4.5-.9 1-1.4 1.3-1.7-.8-2.6-2.5-2.2-4.3.4-1.8 1.9-3.2 2.7-4.8.7-1.3.8-2.1.3-2.6.5-.2 1.3-.2 1.7.2zM7.5 3.3c.4 1.2-.8 2.5-1.5 3.5-.6 1-1.1 1.8-1.1 2.8 0 1 .7 1.8 1.7 2.2-.3.4-.7.8-1.2 1-1.4-.7-2.2-2.1-1.8-3.6.3-1.5 1.6-2.7 2.3-4 .6-1.1.7-1.7.3-2.2.4-.2 1-.1 1.3.3z"/>
      <path fill="#5382a1" d="M19.4 17.5c-2.3 1.9-7.2 2.7-12.7 2.4-2.8-.2-5.4-.8-6.7-1.9-.3-.2.3-.6.6-.5 3.3.9 8.9 1.2 13.9-.2 2.3-.7 4.5-1.7 5.5-2.2.3-.2-.1 2.1-.6 2.4z"/>
    </g>
    <text y="42" text-anchor="middle" fill="#f8f4ff" font-family="Arial, sans-serif" font-size="11.5" font-weight="700">Java</text>
  </g>

  <!-- PLANETARY NODE 3: React / JS -->
  <g transform="translate(-205, 75)">
    <circle r="30" fill="url(#node-bg)" stroke="#61dafb" stroke-width="2"/>
    <!-- React Atom Icon -->
    <g transform="translate(0, 0)">
      <ellipse rx="13" ry="5.2" fill="none" stroke="#61dafb" stroke-width="1.3"/>
      <ellipse rx="13" ry="5.2" transform="rotate(60)" fill="none" stroke="#61dafb" stroke-width="1.3"/>
      <ellipse rx="13" ry="5.2" transform="rotate(120)" fill="none" stroke="#61dafb" stroke-width="1.3"/>
      <circle r="2.8" fill="#61dafb"/>
    </g>
    <text y="42" text-anchor="middle" fill="#f8f4ff" font-family="Arial, sans-serif" font-size="11.5" font-weight="700">React</text>
  </g>

  <!-- PLANETARY NODE 4: AI & ML -->
  <g transform="translate(205, 80)">
    <circle r="30" fill="url(#node-bg)" stroke="#d52cb8" stroke-width="2"/>
    <!-- Neural Chip Icon -->
    <g transform="translate(-12, -12) scale(1)">
      <rect x="5" y="5" width="14" height="14" rx="3" fill="none" stroke="#efa1df" stroke-width="1.8"/>
      <circle cx="12" cy="12" r="3.2" fill="#d52cb8"/>
      <path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="#efa1df" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <text y="42" text-anchor="middle" fill="#f8f4ff" font-family="Arial, sans-serif" font-size="11.5" font-weight="700">AI / ML</text>
  </g>
</g>

<!-- Vertical Hairline Divider -->
<path d="M575 42V565" stroke="#50346b" stroke-width="1.5" stroke-dasharray="4 3"/>

<!-- RIGHT: GROUPED STACK CHIPS -->
<g font-family="Arial, -apple-system, sans-serif" transform="translate(605, 0)">
  
  <!-- 1. LANGUAGES & CORE -->
  <g transform="translate(0, 72)">
    <circle cx="5" cy="5" r="4" fill="#efa1df"/>
    <text x="16" y="9" fill="#efa1df" font-size="12" font-weight="700" letter-spacing="2">LANGUAGES &amp; CORE</text>
    <!-- Chips -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="82" height="28" rx="14" fill="url(#chip-bg-stack)" stroke="#8d4eb0" stroke-width="1.2"/>
      <text x="41" y="18" text-anchor="middle" fill="#f8f4ff" font-size="12.5" font-weight="600">Python</text>
      
      <rect x="90" y="0" width="70" height="28" rx="14" fill="url(#chip-bg-stack)" stroke="#8d4eb0" stroke-width="1.2"/>
      <text x="125" y="18" text-anchor="middle" fill="#f8f4ff" font-size="12.5" font-weight="600">Java</text>
      
      <rect x="168" y="0" width="102" height="28" rx="14" fill="url(#chip-bg-stack)" stroke="#8d4eb0" stroke-width="1.2"/>
      <text x="219" y="18" text-anchor="middle" fill="#f8f4ff" font-size="12.5" font-weight="600">JavaScript</text>
      
      <rect x="278" y="0" width="62" height="28" rx="14" fill="url(#chip-bg-stack)" stroke="#8d4eb0" stroke-width="1.2"/>
      <text x="309" y="18" text-anchor="middle" fill="#f8f4ff" font-size="12.5" font-weight="600">SQL</text>
      
      <rect x="348" y="0" width="74" height="28" rx="14" fill="url(#chip-bg-stack)" stroke="#8d4eb0" stroke-width="1.2"/>
      <text x="385" y="18" text-anchor="middle" fill="#f8f4ff" font-size="12.5" font-weight="600">HTML/CSS</text>
    </g>
  </g>

  <!-- 2. AI, MACHINE LEARNING & GENAI -->
  <g transform="translate(0, 166)">
    <circle cx="5" cy="5" r="4" fill="#efa1df"/>
    <text x="16" y="9" fill="#efa1df" font-size="12" font-weight="700" letter-spacing="2">AI, MACHINE LEARNING &amp; GENAI</text>
    <!-- Row 1 -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="144" height="28" rx="14" fill="url(#chip-bg-stack)" stroke="#8d4eb0" stroke-width="1.2"/>
      <text x="72" y="18" text-anchor="middle" fill="#f8f4ff" font-size="12.5" font-weight="600">Machine Learning</text>
      
      <rect x="152" y="0" width="118" height="28" rx="14" fill="url(#chip-bg-stack)" stroke="#8d4eb0" stroke-width="1.2"/>
      <text x="211" y="18" text-anchor="middle" fill="#f8f4ff" font-size="12.5" font-weight="600">Deep Learning</text>
      
      <rect x="278" y="0" width="104" height="28" rx="14" fill="url(#chip-bg-stack)" stroke="#8d4eb0" stroke-width="1.2"/>
      <text x="330" y="18" text-anchor="middle" fill="#f8f4ff" font-size="12.5" font-weight="600">Scikit-learn</text>
    </g>
    <!-- Row 2 -->
    <g transform="translate(0, 56)">
      <rect x="0" y="0" width="80" height="28" rx="14" fill="url(#chip-bg-stack)" stroke="#8d4eb0" stroke-width="1.2"/>
      <text x="40" y="18" text-anchor="middle" fill="#f8f4ff" font-size="12.5" font-weight="600">LLaMA</text>
      
      <rect x="88" y="0" width="70" height="28" rx="14" fill="url(#chip-bg-stack)" stroke="#8d4eb0" stroke-width="1.2"/>
      <text x="123" y="18" text-anchor="middle" fill="#f8f4ff" font-size="12.5" font-weight="600">Groq</text>
      
      <rect x="166" y="0" width="94" height="28" rx="14" fill="url(#chip-bg-stack)" stroke="#8d4eb0" stroke-width="1.2"/>
      <text x="213" y="18" text-anchor="middle" fill="#f8f4ff" font-size="12.5" font-weight="600">AI Agents</text>
      
      <rect x="268" y="0" width="162" height="28" rx="14" fill="url(#chip-bg-stack)" stroke="#8d4eb0" stroke-width="1.2"/>
      <text x="349" y="18" text-anchor="middle" fill="#f8f4ff" font-size="12.5" font-weight="600">Prompt Engineering</text>
    </g>
  </g>

  <!-- 3. FRAMEWORKS & FULL STACK WEB -->
  <g transform="translate(0, 296)">
    <circle cx="5" cy="5" r="4" fill="#efa1df"/>
    <text x="16" y="9" fill="#efa1df" font-size="12" font-weight="700" letter-spacing="2">FRAMEWORKS &amp; FULL STACK</text>
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="108" height="28" rx="14" fill="url(#chip-bg-stack)" stroke="#8d4eb0" stroke-width="1.2"/>
      <text x="54" y="18" text-anchor="middle" fill="#f8f4ff" font-size="12.5" font-weight="600">Spring Boot</text>
      
      <rect x="116" y="0" width="96" height="28" rx="14" fill="url(#chip-bg-stack)" stroke="#8d4eb0" stroke-width="1.2"/>
      <text x="164" y="18" text-anchor="middle" fill="#f8f4ff" font-size="12.5" font-weight="600">REST APIs</text>
      
      <rect x="220" y="0" width="70" height="28" rx="14" fill="url(#chip-bg-stack)" stroke="#8d4eb0" stroke-width="1.2"/>
      <text x="255" y="18" text-anchor="middle" fill="#f8f4ff" font-size="12.5" font-weight="600">React</text>
      
      <rect x="298" y="0" width="80" height="28" rx="14" fill="url(#chip-bg-stack)" stroke="#8d4eb0" stroke-width="1.2"/>
      <text x="338" y="18" text-anchor="middle" fill="#f8f4ff" font-size="12.5" font-weight="600">Next.js</text>
      
      <rect x="386" y="0" width="68" height="28" rx="14" fill="url(#chip-bg-stack)" stroke="#8d4eb0" stroke-width="1.2"/>
      <text x="420" y="18" text-anchor="middle" fill="#f8f4ff" font-size="12.5" font-weight="600">Tailwind</text>
    </g>
  </g>

  <!-- 4. DATA SCIENCE & STORAGE -->
  <g transform="translate(0, 390)">
    <circle cx="5" cy="5" r="4" fill="#efa1df"/>
    <text x="16" y="9" fill="#efa1df" font-size="12" font-weight="700" letter-spacing="2">DATA SCIENCE &amp; STORAGE</text>
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="102" height="28" rx="14" fill="url(#chip-bg-stack)" stroke="#8d4eb0" stroke-width="1.2"/>
      <text x="51" y="18" text-anchor="middle" fill="#f8f4ff" font-size="12.5" font-weight="600">PostgreSQL</text>
      
      <rect x="110" y="0" width="76" height="28" rx="14" fill="url(#chip-bg-stack)" stroke="#8d4eb0" stroke-width="1.2"/>
      <text x="148" y="18" text-anchor="middle" fill="#f8f4ff" font-size="12.5" font-weight="600">MySQL</text>
      
      <rect x="194" y="0" width="78" height="28" rx="14" fill="url(#chip-bg-stack)" stroke="#8d4eb0" stroke-width="1.2"/>
      <text x="233" y="18" text-anchor="middle" fill="#f8f4ff" font-size="12.5" font-weight="600">Pandas</text>
      
      <rect x="280" y="0" width="76" height="28" rx="14" fill="url(#chip-bg-stack)" stroke="#8d4eb0" stroke-width="1.2"/>
      <text x="318" y="18" text-anchor="middle" fill="#f8f4ff" font-size="12.5" font-weight="600">NumPy</text>
    </g>
  </g>

  <!-- 5. TOOLS & DEVOPS -->
  <g transform="translate(0, 484)">
    <circle cx="5" cy="5" r="4" fill="#efa1df"/>
    <text x="16" y="9" fill="#efa1df" font-size="12" font-weight="700" letter-spacing="2">DEVELOPER TOOLS &amp; DEVOPS</text>
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="56" height="28" rx="14" fill="url(#chip-bg-stack)" stroke="#8d4eb0" stroke-width="1.2"/>
      <text x="28" y="18" text-anchor="middle" fill="#f8f4ff" font-size="12.5" font-weight="600">Git</text>
      
      <rect x="64" y="0" width="76" height="28" rx="14" fill="url(#chip-bg-stack)" stroke="#8d4eb0" stroke-width="1.2"/>
      <text x="102" y="18" text-anchor="middle" fill="#f8f4ff" font-size="12.5" font-weight="600">GitHub</text>
      
      <rect x="148" y="0" width="76" height="28" rx="14" fill="url(#chip-bg-stack)" stroke="#8d4eb0" stroke-width="1.2"/>
      <text x="186" y="18" text-anchor="middle" fill="#f8f4ff" font-size="12.5" font-weight="600">Docker</text>
      
      <rect x="232" y="0" width="88" height="28" rx="14" fill="url(#chip-bg-stack)" stroke="#8d4eb0" stroke-width="1.2"/>
      <text x="276" y="18" text-anchor="middle" fill="#f8f4ff" font-size="12.5" font-weight="600">VS Code</text>
    </g>
  </g>

</g>
</svg>