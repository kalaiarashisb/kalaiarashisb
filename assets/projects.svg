      <text x="14" y="9" fill="#f8f4ff" font-size="13" font-weight="700">Personalized Curriculum Engine</text>
      <text x="14" y="27" fill="#c4b5d9" font-size="12">Dynamic AI-driven roadmaps that adjust continuously</text>
      <text x="14" y="43" fill="#c4b5d9" font-size="12">based on learner pacing, quiz results, and diagnostic gaps.</text>
    </g>

