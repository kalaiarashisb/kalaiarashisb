      <text x="14" y="9" fill="#f8f4ff" font-size="13" font-weight="700">Tactile V-Braille Touchpad Matrix</text>
      <text x="14" y="27" fill="#c4b5d9" font-size="12">Proprietary virtual tactile keypad interface allowing visually</text>
      <text x="14" y="43" fill="#c4b5d9" font-size="12">impaired users to execute PIN and payment input securely.</text>
    </g>

    <!-- Point 2 -->
    <g transform="translate(0, 78)">
