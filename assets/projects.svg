    <circle cx="8" cy="8" r="3.5" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="18" y="12" fill="#86efac" font-size="11" font-weight="700" letter-spacing="1">FULL STACK &amp; APPLIED AI</text>
  </g>

  <!-- Hairline Header Divider -->
  <line x1="0" y1="32" x2="1012" y2="32" stroke="#4a2e69" stroke-width="1.2"/>
</g>

