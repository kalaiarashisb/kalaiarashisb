      <text x="196" y="15" text-anchor="middle" fill="#f8f4ff" font-size="11" font-weight="600">LLaMA</text>

      <rect x="240" y="0" width="80" height="23" rx="11.5" fill="url(#chip-daily)" stroke="#814fa8" stroke-width="1.1"/>
      <text x="280" y="15" text-anchor="middle" fill="#f8f4ff" font-size="11" font-weight="600">Groq API</text>
