      <rect x="94" y="0" width="138" height="23" rx="11.5" fill="url(#chip-echo)" stroke="#5263a8" stroke-width="1.1"/>
      <text x="163" y="15" text-anchor="middle" fill="#f8f4ff" font-size="11" font-weight="600">Accessibility (A11y)</text>

      <rect x="240" y="0" width="118" height="23" rx="11.5" fill="url(#chip-echo)" stroke="#5263a8" stroke-width="1.1"/>
      <text x="299" y="15" text-anchor="middle" fill="#f8f4ff" font-size="11" font-weight="600">Haptic Feedback</text>
