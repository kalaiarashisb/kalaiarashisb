<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-labelledby="title desc">
<title id="title">Featured Engineering Deliverables — Kalaiarashi S B</title>
<desc id="desc">Production-grade project showcase featuring DailySprout and EchoTouch with architectural breakdowns, tech stack chips, and impact metrics.</desc>
<defs>
  <!-- Background Gradients -->
  <linearGradient id="proj-panel-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0c0922"/>
    <stop offset="50%" stop-color="#140c2c"/>
    <stop offset="100%" stop-color="#070515"/>
  </linearGradient>
  <linearGradient id="card-daily-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#191136"/>
    <stop offset="100%" stop-color="#100a24"/>
  </linearGradient>
  <linearGradient id="card-echo-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#151236"/>
    <stop offset="100%" stop-color="#0d0a24"/>
  </linearGradient>

  <!-- Border Gradients -->
  <linearGradient id="border-daily" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#22c55e" stop-opacity="0.8"/>
    <stop offset="50%" stop-color="#d52cb8" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#c6a6f4" stop-opacity="0.8"/>
  </linearGradient>
  <linearGradient id="border-echo" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
    <stop offset="50%" stop-color="#a855f7" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#efa1df" stop-opacity="0.8"/>
  </linearGradient>

  <!-- Chip Gradients -->
  <linearGradient id="chip-daily" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#24153f"/>
    <stop offset="100%" stop-color="#160d2b"/>
  </linearGradient>
  <linearGradient id="chip-echo" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#1a1842"/>
    <stop offset="100%" stop-color="#100f2e"/>
  </linearGradient>

  <!-- Dot Grid Pattern -->
  <pattern id="dotGridProjects" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#7948a8" opacity="0.14"/>
  </pattern>
</defs>

<!-- Outer Container -->
<rect x="1" y="1" width="1098" height="538" rx="26" fill="url(#proj-panel-bg)" stroke="#5e397c" stroke-width="2"/>
<rect x="1" y="1" width="1098" height="538" rx="26" fill="url(#dotGridProjects)"/>

<!-- ========================================== -->
<!-- TOP WINDOW / EXPLORER HEADER               -->
<!-- ========================================== -->
<g transform="translate(44, 20)" font-family="Arial, -apple-system, sans-serif">
  <!-- macOS Terminal Window Dots -->
  <circle cx="6" cy="14" r="5.5" fill="#ff5f56"/>
  <circle cx="24" cy="14" r="5.5" fill="#ffbd2e"/>
  <circle cx="42" cy="14" r="5.5" fill="#27c93f"/>

  <!-- Category Title -->
  <text x="64" y="18" fill="#efa1df" font-size="12" font-weight="700" letter-spacing="3">FEATURED ENGINEERING DELIVERABLES</text>

  <!-- Status Indicator (Top Right - comfortably before 1012 line end) -->
