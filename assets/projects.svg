      <rect x="106" y="0" width="72" height="23" rx="11.5" fill="url(#chip-daily)" stroke="#814fa8" stroke-width="1.1"/>
      <text x="142" y="15" text-anchor="middle" fill="#f8f4ff" font-size="11" font-weight="600">FastAPI</text>

      <rect x="186" y="0" width="84" height="23" rx="11.5" fill="url(#chip-daily)" stroke="#814fa8" stroke-width="1.1"/>
      <text x="228" y="15" text-anchor="middle" fill="#f8f4ff" font-size="11" font-weight="600">REST APIs</text>
