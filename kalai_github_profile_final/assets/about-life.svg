<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="320" viewBox="0 0 1100 320" role="img" aria-labelledby="title desc">
<title id="title">About and Capabilities — Kalaiarashi S B</title>
<desc id="desc">Core engineering capabilities alongside a three-slide animated interests carousel with segment progress bars.</desc>
<defs>
  <linearGradient id="panel-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0c0a22"/>
    <stop offset="60%" stop-color="#180e2f"/>
    <stop offset="100%" stop-color="#080718"/>
  </linearGradient>
  <linearGradient id="aurora-edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#c6a6f4"/>
    <stop offset="50%" stop-color="#d52cb8"/>
    <stop offset="100%" stop-color="#efa1df"/>
  </linearGradient>
  <linearGradient id="pill-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#23143c"/>
    <stop offset="100%" stop-color="#160c28"/>
  </linearGradient>
  <pattern id="dotGridAbout" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#7948a8" opacity="0.16"/>
  </pattern>
</defs>

<!-- Outer Container -->
<rect x="1" y="1" width="1098" height="318" rx="26" fill="url(#panel-bg)" stroke="#633c82" stroke-width="2"/>
<rect x="1" y="1" width="1098" height="318" rx="26" fill="url(#dotGridAbout)"/>

<!-- LEFT COLUMN: CAPABILITIES -->
<g font-family="Arial, -apple-system, sans-serif">
  <text x="44" y="48" fill="#efa1df" font-size="13" font-weight="700" letter-spacing="4">ABOUT / VALUE PROPOSITION</text>
  <text x="44" y="86" fill="#f8f4ff" font-size="26" font-weight="700">Curious by nature. Building with purpose.</text>
  <text x="44" y="118" fill="#c4b5d9" font-size="15">Computer Science Engineer bridging full-stack systems and applied AI.</text>
  <text x="44" y="162" fill="#c6a6f4" font-size="12" font-weight="700" letter-spacing="2">CORE CAPABILITIES</text>

  <!-- 2x2 Grid of Capability Chips -->
  <!-- Row 1 -->
  <g transform="translate(44, 178)">
    <rect width="250" height="38" rx="19" fill="url(#pill-bg)" stroke="#7e49a1" stroke-width="1.3"/>
    <circle cx="20" cy="19" r="4.5" fill="#efa1df"/>
    <text x="34" y="24" fill="#f8f4ff" font-size="13.5" font-weight="600">Application Engineering</text>
  </g>
  <g transform="translate(306, 178)">
    <rect width="250" height="38" rx="19" fill="url(#pill-bg)" stroke="#7e49a1" stroke-width="1.3"/>
    <circle cx="20" cy="19" r="4.5" fill="#c6a6f4"/>
    <text x="34" y="24" fill="#f8f4ff" font-size="13.5" font-weight="600">AI / ML &amp; GenAI Systems</text>
  </g>
  
  <!-- Row 2 -->
  <g transform="translate(44, 226)">
    <rect width="250" height="38" rx="19" fill="url(#pill-bg)" stroke="#7e49a1" stroke-width="1.3"/>
    <circle cx="20" cy="19" r="4.5" fill="#c6a6f4"/>
    <text x="34" y="24" fill="#f8f4ff" font-size="13.5" font-weight="600">Data Science &amp; Pipelines</text>
  </g>
  <g transform="translate(306, 226)">
    <rect width="250" height="38" rx="19" fill="url(#pill-bg)" stroke="#7e49a1" stroke-width="1.3"/>
    <circle cx="20" cy="19" r="4.5" fill="#efa1df"/>
    <text x="34" y="24" fill="#f8f4ff" font-size="13.5" font-weight="600">Algorithmic Problem Solving</text>
  </g>
</g>

<!-- Vertical Divider -->
<path d="M595 32V288" stroke="#5a3973" stroke-width="1.5" stroke-dasharray="4 3"/>

<!-- RIGHT COLUMN: THREE-SLIDE INTERESTS CAROUSEL -->
<g font-family="Arial, -apple-system, sans-serif">
  <text x="635" y="48" fill="#efa1df" font-size="13" font-weight="700" letter-spacing="3.5">CURRENT FOCUS &amp; INTERESTS</text>

  <!-- Slide 1 -->
  <g opacity="1">
    <text x="635" y="106" fill="#f8f4ff" font-size="24" font-weight="700">01 / Full-Stack Applications</text>
    <text x="635" y="140" fill="#c4b5d9" font-size="15.5">Architecting robust backends with Spring Boot,</text>
    <text x="635" y="165" fill="#c4b5d9" font-size="15.5">responsive React interfaces, and scalable REST APIs.</text>
    <animate attributeName="opacity" values="1;1;0;0;0;0;0;1" keyTimes="0;0.31;0.34;0.64;0.67;0.97;0.98;1" dur="12s" repeatCount="indefinite"/>
  </g>

  <!-- Slide 2 -->
  <g opacity="0">
    <text x="635" y="106" fill="#f8f4ff" font-size="24" font-weight="700">02 / Applied AI &amp; Machine Learning</text>
    <text x="635" y="140" fill="#c4b5d9" font-size="15.5">Developing autonomous AI agent workflows,</text>
    <text x="635" y="165" fill="#c4b5d9" font-size="15.5">Groq/LLaMA pipelines, and practical predictive models.</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0;0;0" keyTimes="0;0.31;0.34;0.64;0.67;0.97;0.98;1" dur="12s" repeatCount="indefinite"/>
  </g>

  <!-- Slide 3 -->
  <g opacity="0">
    <text x="635" y="106" fill="#f8f4ff" font-size="24" font-weight="700">03 / Collaborative Innovation</text>
    <text x="635" y="140" fill="#c4b5d9" font-size="15.5">Delivering accessible, human-centered products</text>
    <text x="635" y="165" fill="#c4b5d9" font-size="15.5">(DailySprout &amp; EchoTouch) through agile teamwork.</text>
    <animate attributeName="opacity" values="0;0;0;0;1;1;0;0" keyTimes="0;0.31;0.64;0.67;0.97;0.98;0.99;1" dur="12s" repeatCount="indefinite"/>
  </g>

  <!-- Three Segment Progress Bars (Filling over 4s each = 33.3% per slide) -->
  <!-- Segment 1 -->
  <rect x="635" y="214" width="124" height="4.5" rx="2.2" fill="#3f2756"/>
  <rect x="635" y="214" width="0" height="4.5" rx="2.2" fill="url(#aurora-edge)">
    <animate attributeName="width" values="0;124;0;0" keyTimes="0;0.31;0.34;1" dur="12s" repeatCount="indefinite"/>
  </rect>

  <!-- Segment 2 -->
  <rect x="771" y="214" width="124" height="4.5" rx="2.2" fill="#3f2756"/>
  <rect x="771" y="214" width="0" height="4.5" rx="2.2" fill="url(#aurora-edge)">
    <animate attributeName="width" values="0;0;124;0;0" keyTimes="0;0.34;0.64;0.67;1" dur="12s" repeatCount="indefinite"/>
  </rect>

  <!-- Segment 3 -->
  <rect x="907" y="214" width="124" height="4.5" rx="2.2" fill="#3f2756"/>
  <rect x="907" y="214" width="0" height="4.5" rx="2.2" fill="url(#aurora-edge)">
    <animate attributeName="width" values="0;0;124;0" keyTimes="0;0.67;0.97;1" dur="12s" repeatCount="indefinite"/>
  </rect>

  <!-- Bottom Subtitle -->
  <text x="635" y="258" fill="#9b85b5" font-size="13">Constantly learning, building, and delivering scalable solutions.</text>
</g>
</svg>